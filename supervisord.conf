[supervisord]
nodaemon=true
logfile=%(here)s/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=%(here)s/run/supervisord.pid

[supervisorctl]
serverurl=unix://%(here)s/run/supervisor.sock

[unix_http_server]
file=%(here)s/run/supervisor.sock
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:telegram_bot]
command=python -u bot.py
directory=%(here)s
autostart=true
autorestart=true
; Incluso los fallos inmediatos deben reiniciarse, sin quedar en estado FATAL.
startsecs=0
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
